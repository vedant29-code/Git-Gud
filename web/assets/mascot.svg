<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="judgeRobes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00b862"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal Hacker Badge Frame -->
  <polygon points="100,10 180,50 180,150 100,190 20,150 20,50" 
           fill="#0b0f17" stroke="#1e293b" stroke-width="3"/>
  <polygon points="100,16 174,53 174,147 100,184 26,147 26,53" 
           fill="none" stroke="#00ff88" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>

  <!-- Matrix Grid Accent inside badge -->
  <line x1="26" y1="100" x2="174" y2="100" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
  <line x1="100" y1="16" x2="100" y2="184" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>

  <!-- Judge Robe Body -->
  <path d="M60 160 Q100 135 140 160 L145 178 Q100 186 55 178 Z" fill="url(#judgeRobes)" stroke="#334155" stroke-width="2"/>
  <!-- Robe Collar -->
  <polygon points="90,140 100,155 110,140 100,135" fill="#f8fafc"/>
  <polygon points="85,140 100,152 115,140 100,145" fill="#e2e8f0"/>

  <!-- Judge Head / Masked Face -->
  <rect x="75" y="75" width="50" height="58" rx="14" fill="#111827" stroke="#374151" stroke-width="2"/>
  
  <!-- Cyber Judge Wig / Hood -->
  <path d="M65 75 Q100 45 135 75 C145 95 140 120 135 130 C130 115 125 90 125 90 L75 90 C75 90 70 115 65 130 C60 120 55 95 65 75 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Powdered Wig Rolls (ASCII / Cyber stylized) -->
  <circle cx="62" cy="85" r="8" fill="#334155"/>
  <circle cx="58" cy="100" r="8" fill="#334155"/>
  <circle cx="138" cy="85" r="8" fill="#334155"/>
  <circle cx="142" cy="100" r="8" fill="#334155"/>

  <!-- Cyber Visor / Glasses with code reflection -->
  <rect x="72" y="88" width="56" height="18" rx="4" fill="#030712" stroke="#00ff88" stroke-width="1.5" filter="url(#neonGlow)"/>
  <line x1="76" y1="97" x2="124" y2="97" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Terminal Mouth Prompt -->
  <text x="88" y="125" font-family="monospace" font-size="11" font-weight="bold" fill="#00ff88">&gt;_</text>
  <rect x="104" y="117" width="6" height="9" fill="#00ff88" opacity="0.8"/>

  <!-- Glowing Neon Gavel -->
  <g transform="translate(118, 55) rotate(32)" filter="url(#neonGlow)">
    <!-- Gavel Head -->
    <rect x="6" y="2" width="22" height="12" rx="3" fill="url(#neonGreen)"/>
    <rect x="4" y="0" width="4" height="16" rx="2" fill="#a7f3d0"/>
    <rect x="26" y="0" width="4" height="16" rx="2" fill="#a7f3d0"/>
    <!-- Handle -->
    <rect x="15" y="14" width="4" height="26" rx="2" fill="#64748b"/>
  </g>

  <!-- Sparkles / Roast Embers -->
  <circle cx="150" cy="45" r="2" fill="#ff3355" filter="url(#neonGlow)"/>
  <circle cx="165" cy="65" r="1.5" fill="#ffaa00" filter="url(#neonGlow)"/>
  <circle cx="45" cy="55" r="1.5" fill="#00ff88" filter="url(#neonGlow)"/>
</svg>
