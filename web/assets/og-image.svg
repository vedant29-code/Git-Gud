<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00dd77"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="100%" stop-color="#ff1133"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <g stroke="#1b2330" stroke-width="1" opacity="0.6">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>

    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Terminal Frame -->
  <rect x="70" y="60" width="1060" height="510" rx="14" fill="#0b0f16" stroke="#253041" stroke-width="2"/>
  
  <!-- Terminal Top Bar -->
  <path d="M70 74 Q70 60 84 60 L1116 60 Q1130 60 1130 74 L1130 105 L70 105 Z" fill="#141c26"/>
  <circle cx="102" cy="82" r="6" fill="#ff5f56"/>
  <circle cx="124" cy="82" r="6" fill="#ffbd2e"/>
  <circle cx="146" cy="82" r="6" fill="#27c93f"/>
  <text x="540" y="87" font-family="ui-monospace, monospace" font-size="14" fill="#8b949e" text-anchor="middle">gitgud-pre-commit.sh — 100% Local AI Judge</text>

  <!-- Brand Title -->
  <text x="110" y="175" font-family="ui-monospace, monospace" font-size="44" font-weight="900" fill="#f0f6fc">
    Git-Gud <tspan fill="#00ff88" filter="url(#glow)">AI</tspan> ⚖️🔥
  </text>
  <text x="110" y="215" font-family="ui-monospace, monospace" font-size="22" font-weight="600" fill="#00ff88">
    The Pre-Commit Judge &amp; Jury
  </text>
  <text x="110" y="255" font-family="system-ui, sans-serif" font-size="18" fill="#9ca3af">
    A local pre-commit hook powered by Ollama that roasts bad code &amp; blocks dangerous commits.
  </text>

  <!-- Verdict Card in Terminal -->
  <rect x="110" y="290" width="980" height="180" rx="8" fill="#160c11" stroke="#ff3355" stroke-width="1.5"/>
  <text x="135" y="325" font-family="ui-monospace, monospace" font-size="14" font-weight="bold" fill="#ffaa00">
    🔥 THE JUDGE'S ROAST:
  </text>
  <text x="135" y="355" font-family="ui-monospace, monospace" font-size="15" fill="#f87171" font-style="italic">
    "A bare except block silently swallowing KeyboardInterrupt and returning null?
  </text>
  <text x="135" y="380" font-family="ui-monospace, monospace" font-size="15" fill="#f87171" font-style="italic">
    Hardcoding production AWS keys in 2026 is a bold career move. Git GUD or get out."
  </text>
  
  <rect x="135" y="405" width="230" height="26" rx="4" fill="#2e1017"/>
  <text x="145" y="423" font-family="ui-monospace, monospace" font-size="13" font-weight="bold" fill="#ff3355">
    🚫 COMMIT REJECTED (2.8/10)
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(110, 500)" font-family="ui-monospace, monospace" font-size="13">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#111c16" stroke="#00ff88" stroke-width="1"/>
    <text x="90" y="22" fill="#00ff88" text-anchor="middle">🔒 100% Local &amp; Private</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="180" height="34" rx="17" fill="#141d2b" stroke="#38bdf8" stroke-width="1"/>
    <text x="285" y="22" fill="#38bdf8" text-anchor="middle">⚡ Zero pip Dependencies</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="180" height="34" rx="17" fill="#1f1811" stroke="#fbbf24" stroke-width="1"/>
    <text x="480" y="22" fill="#fbbf24" text-anchor="middle">🛡️ Fail-Open Safety</text>

    <!-- Pill 4 -->
    <rect x="585" y="0" width="190" height="34" rx="17" fill="#1d1222" stroke="#e879f9" stroke-width="1"/>
    <text x="680" y="22" fill="#e879f9" text-anchor="middle">🌶️ 3 Roast Intensities</text>

    <!-- Quick install command -->
    <text x="980" y="22" fill="#6b7280" text-anchor="end">curl -fsSL ... | sh</text>
  </g>
</svg>
